<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AttendEase - Modern Employee Attendance Management System" />
  <title>AttendEase — Modern Employee Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<aside class="sidebar" id="sidebar" style="display:none">
  <div class="sidebar-brand">
    <div class="brand-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="3"/>
        <path d="M8 2v4M16 2v4M3 10h18" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">AttendEase</div>
      <div class="brand-tag">PRO DASHBOARD</div>
    </div>
  </div>
  
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  
  <div class="sidebar-footer" id="sidebar-footer">
    <div class="user-info">
      <div class="avatar" id="user-avatar">A</div>
      <div>
        <div class="user-name" id="user-name">Admin User</div>
        <div class="user-role" id="user-role">Admin Account</div>
      </div>
    </div>
    <button type="button" class="logout-btn" id="logout-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16,17 21,12 16,7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign Out
    </button>
  </div>
</aside>

<div class="layout" id="layout">
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Toggle Navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-right">
      <span class="date-badge" id="date-badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M8 2v4M16 2v4M3 10h18"/>
        </svg>
        <span id="current-date"></span>
      </span>
    </div>
  </header>

  <main class="main-content" id="main-content">
    <div class="flash-container" id="flash-container"></div>
  </main>
</div>

<div class="sidebar-overlay" id="overlay"></div>

<script src="js/app.js"></script>
<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    if (sidebar) sidebar.classList.toggle('open');
    if (overlay) overlay.classList.toggle('active');
  }
</script>

</body>
</html>
